<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular Interactive FMCW Radar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9fafb; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: #f3f4f6; padding: 15px; border-radius: 6px; }
        .control-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #374151; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .value-display { font-weight: normal; color: #4f46e5; }
    </style>
</head>
<body>

<div class="container">
    <h2>Modular FMCW Multi-Target Radar</h2>
    <p>Adjust the slider metrics below. Modulations recalculate across structural modules immediately.</p>

    <div class="controls">
        <!-- <div class="control-group">
            <label for="range1">Target 1 Range: <span id="val1" class="value-display">20</span> m</label>
            <input type="range" id="range1" min="0.1" max="4.7" value="20" step="0.01">
        </div>
        <div class="control-group">
            <label for="range2">Target 2 Range: <span id="val2" class="value-display">50</span> m</label>
            <input type="range" id="range2" min="0.1" max="4.7" value="50" step="0.01">
        </div> -->
        <div class="toggle-container">
            <span class="toggle-label">Hanning Window:</span>
            <label class="switch">
                <input type="checkbox" id="hannToggle">
                <span class="slider round"></span>
            </label>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
            <span class="toggle-label">Lambda (Scale):</span>
            <input type="range" id="lambda_slider" min="1" max="20" value="5">
            <span style="font-weight: bold; min-width: 45px;"><span id="val_lambda">5</span>e-6</span>
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <button id="addTargetBtn" class="btn-add">+ Add New Target</button>
    </div>

        <div id="targetControlsContainer"></div>
    </div>

    <div id="radarChart" style="width:100%; height:450px;"></div>
    <div id="frequencyHistory" style="width:100%; height:450px;"></div>
</div>

    <script type="module" src="app.js"></script>
</body>
</html>
